[package]
name = "contactly"
version = "0.1.0"
edition = "2021"

[dependencies]
# The "tokio" feature gives iced an async runtime, needed for Task::perform
# with tokio::time::sleep (used to fake a network call on login).
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
